name: Deploy to Render

# Render cannot auto-deploy this service: it was created from the repo's public
# Git URL, so no webhook ever tells Render that a push happened ("Services that
# use a prebuilt Docker image or a public Git repository URL must be deployed
# manually" — https://render.com/docs/deploys). This workflow supplies the
# missing trigger by calling the service's deploy hook.
#
# Setup: Render Dashboard -> the service -> Settings -> Deploy Hook, copy the
# URL, then add it as a repository secret named RENDER_DEPLOY_HOOK_URL
# (Settings -> Secrets and variables -> Actions -> New repository secret).
# The hook URL is a credential: keep it in the secret, never in this file.
#
# Tests gate the deploy: the deploy job needs the test job, so a failing suite
# leaves production on the previous commit rather than shipping a broken build.

on:
  push:
    branches: [main]

permissions:
  contents: read

# Let a queued deploy finish rather than cancelling it mid-build; Render also
# cancels superseded builds on its own side.
concurrency:
  group: deploy-render
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The runtime Render builds with (render.yaml NODE_VERSION), so a test
          # that only passes on a newer local Node fails here first.
          node-version: '24.22.1'
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  deploy:
    # Nothing below runs unless the suite passes.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # Tolerate a trailing newline or CR if the secret was pasted in.
          RENDER_DEPLOY_HOOK_URL=$(printf '%s' "$RENDER_DEPLOY_HOOK_URL" | tr -d '\r\n')

          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Repository secret RENDER_DEPLOY_HOOK_URL is not set."
            exit 1
          fi

          # Deploy this exact commit rather than whatever the branch points at
          # when the hook fires, so back-to-back pushes cannot race.
          # The hook URL already has a ?key=... query, so append with &.
          sep='?'
          case "$RENDER_DEPLOY_HOOK_URL" in
            *\?*) sep='&' ;;
          esac
          url="${RENDER_DEPLOY_HOOK_URL}${sep}ref=${COMMIT_SHA}"

          status=$(curl -sS -o "$RUNNER_TEMP/render-response.txt" \
            -w '%{http_code}' \
            --retry 3 --retry-delay 5 --retry-all-errors \
            "$url")
          echo "Render responded with HTTP $status"
          cat "$RUNNER_TEMP/render-response.txt"

          case "$status" in
            2*)
              echo "Deploy triggered for $COMMIT_SHA."
              ;;
            *)
              echo "::error::Render deploy hook returned HTTP $status"
              exit 1
              ;;
          esac

      - name: Confirm the new commit is serving
        # The hook answers 202 immediately, so this waits out the build (~100 s
        # on the free plan) and then proves the pushed commit is what goes out,
        # rather than just that the site answers.
        env:
          COMMIT_SHA: ${{ github.sha }}
          PRODUCTION_URL: https://wheelover.onrender.com
          TIMEOUT_SECONDS: 720
        run: |
          target="${PRODUCTION_URL%/}/build-info.json"
          deadline=$((SECONDS + TIMEOUT_SECONDS))
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            # A per-attempt nonce defeats any shared cache: read this fresh.
            body=$(curl -sS --max-time 20 -H 'Cache-Control: no-cache' \
              "${target}?attempt=${attempt}" || true)
            served=$(printf '%s' "$body" \
              | grep -o '"commit"[[:space:]]*:[[:space:]]*"[^"]*"' \
              | head -1 | sed -E 's/.*"([^"]*)"$/\1/' || true)

            if [ "$served" = "$COMMIT_SHA" ]; then
              echo "Production is serving ${COMMIT_SHA} (attempt ${attempt})."
              printf '%s\n' "$body"
              exit 0
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Production never served ${COMMIT_SHA} within ${TIMEOUT_SECONDS}s."
              echo "Last /build-info.json body: ${body:-<empty>}"
              exit 1
            fi

            echo "attempt ${attempt}: serving ${served:-<none yet>}, waiting 10s..."
            sleep 10
          done
