# Based on GDAL's standard osmconf.ini. Keep its default layer schemas and
# geometry interpretation; expose the extra tags required by the marine builder.
[general]
closed_ways_are_polygons=aeroway,amenity,boundary,building,craft,geological,historic,landuse,leisure,military,natural,office,place,shop,sport,tourism,highway=platform,public_transport=platform
report_all_nodes=no

[points]
osm_id=yes
attributes=name,barrier,highway,ref,address,is_in,place,man_made,seamark,seamark:type,seamark:light:character,seamark:light:colour,seamark:light:sector_start,seamark:light:sector_end,seamark:light:range,seamark:light:height,seamark:buoy_lateral:category,seamark:beacon_lateral:category,seamark:calling-in_point:channel,seamark:calling-in_point:callsign,seamark:calling-in_point:traffic_flow,seamark:communication_area:category,seamark:radio_station:channel,seamark:radio_station:callsign,seamark:topmark:shape,seamark:topmark:colour,route
unsignificant=created_by,converted_by,source,time,ele,attribution
ignore=created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME
other_tags=yes

[lines]
osm_id=yes
attributes=name,highway,waterway,aerialway,barrier,man_made,railway,seamark,seamark:type,seamark:light:character,seamark:light:colour,seamark:light:sector_start,seamark:light:sector_end,seamark:light:range,seamark:light:height,seamark:buoy_lateral:category,seamark:beacon_lateral:category,seamark:calling-in_point:channel,seamark:calling-in_point:callsign,seamark:calling-in_point:traffic_flow,seamark:communication_area:category,seamark:radio_station:channel,seamark:radio_station:callsign,seamark:topmark:shape,seamark:topmark:colour,route
ignore=created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME
other_tags=yes
computed_attributes=z_order
z_order_type=Integer
z_order_sql="SELECT (CASE [highway] WHEN 'minor' THEN 3 WHEN 'road' THEN 3 WHEN 'unclassified' THEN 3 WHEN 'residential' THEN 3 WHEN 'tertiary_link' THEN 4 WHEN 'tertiary' THEN 4 WHEN 'secondary_link' THEN 6 WHEN 'secondary' THEN 6 WHEN 'primary_link' THEN 7 WHEN 'primary' THEN 7 WHEN 'trunk_link' THEN 8 WHEN 'trunk' THEN 8 WHEN 'motorway_link' THEN 9 WHEN 'motorway' THEN 9 ELSE 0 END) + (CASE WHEN [bridge] IN ('yes', 'true', '1') THEN 10 ELSE 0 END) + (CASE WHEN [tunnel] IN ('yes', 'true', '1') THEN -10 ELSE 0 END) + (CASE WHEN [railway] IS NOT NULL THEN 5 ELSE 0 END)"

[multipolygons]
osm_id=yes
attributes=name,type,aeroway,amenity,admin_level,barrier,boundary,building,craft,geological,historic,land_area,landuse,leisure,man_made,military,natural,office,place,shop,sport,tourism,route,seamark,seamark:type,seamark:light:character,seamark:light:colour,seamark:light:sector_start,seamark:light:sector_end,seamark:light:range,seamark:light:height,seamark:buoy_lateral:category,seamark:beacon_lateral:category,seamark:calling-in_point:channel,seamark:calling-in_point:callsign,seamark:calling-in_point:traffic_flow,seamark:communication_area:category,seamark:radio_station:channel,seamark:radio_station:callsign,seamark:topmark:shape,seamark:topmark:colour
ignore=area,created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME
other_tags=yes

[multilinestrings]
osm_id=yes
attributes=name,type,route,ref,operator,seamark,seamark:type,seamark:light:character,seamark:light:colour,seamark:light:sector_start,seamark:light:sector_end,seamark:light:range,seamark:light:height,seamark:buoy_lateral:category,seamark:beacon_lateral:category,seamark:calling-in_point:channel,seamark:calling-in_point:callsign,seamark:calling-in_point:traffic_flow,seamark:communication_area:category,seamark:radio_station:channel,seamark:radio_station:callsign,seamark:topmark:shape,seamark:topmark:colour
ignore=area,created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME
other_tags=yes

[other_relations]
osm_id=yes
attributes=name,type,route,ref,operator,seamark,seamark:type,seamark:light:character,seamark:light:colour,seamark:light:sector_start,seamark:light:sector_end,seamark:light:range,seamark:light:height,seamark:buoy_lateral:category,seamark:beacon_lateral:category,seamark:calling-in_point:channel,seamark:calling-in_point:callsign,seamark:calling-in_point:traffic_flow,seamark:communication_area:category,seamark:radio_station:channel,seamark:radio_station:callsign,seamark:topmark:shape,seamark:topmark:colour
ignore=area,created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME
